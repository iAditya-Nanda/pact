[project]
name = "pact-agent"
version = "0.1.0"
description = "Local-First Autonomous Executive Chief of Staff"
authors = [{ name = "PACT Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
